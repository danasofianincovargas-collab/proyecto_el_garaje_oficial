<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - El Garaje</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons para el ojito -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container login-container">
        <div class="login-card">
            <h3 class="fw-bold text-center mb-1">🚗 El Garaje</h3>
            <p class="text-muted text-center small mb-4">Gestión Administrativa</p>

            <!-- Alerta oculta para errores, poblada dinámicamente por script.js -->
            <div id="alertaError" class="alert alert-danger d-none py-2 small text-center" role="alert"></div>

            <!-- Guía visible para el instructor / roles -->
            <div class="alert alert-warning py-2 small mb-3">
                <strong>Credenciales de prueba:</strong><br>
                👑 <strong>Admin:</strong> admin@elgaraje.com / Garaje2026*<br>
                🍳 <strong>Cocina:</strong> cocina@elgaraje.com / Cocina2026*<br>
                📋 <strong>Mesero:</strong> mesero@elgaraje.com / Mesero2026*
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label small text-muted">Correo Electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="admin@elgaraje.com" required>
                </div>

                <!-- Contraseña con el ojito integrado -->
                <div class="mb-3">
                    <label class="form-label small text-muted">Contraseña</label>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                            <i class="bi bi-eye" id="iconoOjo"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="chkRecordar">
                    <label class="form-check-label small text-muted" for="chkRecordar">Recordar mi correo</label>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2">Ingresar al Sistema</button>
            </form>

            <!-- Enlace libre para clientes -->
            <div class="text-center mt-3">
                <a href="menu.html" class="text-decoration-none small text-warning fw-bold">🍽️ Ir al Menú (Clientes sin registro)</a>
            </div>

            <div class="text-center mt-2">
                <a href="index.html" class="text-decoration-none small text-muted">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
